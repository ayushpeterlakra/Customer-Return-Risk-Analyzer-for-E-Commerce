# Local PostgreSQL for development. Start with: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: return-risk-db
    environment:
      POSTGRES_USER: rra_user
      POSTGRES_PASSWORD: rra_password
      POSTGRES_DB: return_risk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rra_user -d return_risk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
